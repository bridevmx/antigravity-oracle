version: '3.8'

services:
  antigravity-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity-claude-proxy
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NODE_ENV=${NODE_ENV:-production}
    volumes:
      # Mapeo persistente de la configuración y tokens de autenticación
      - ./data:/home/node/.config/antigravity-proxy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
