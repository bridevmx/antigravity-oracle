services:
  antigravity-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity-claude-proxy
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=${NODE_ENV:-production}
    volumes:
      # Persistencia OAuth / config (mismo path que Coolify Storages)
      - ./data:/home/node/.config/antigravity-proxy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
